# Local development stack.
#
# Infrastructure only for now. The `api` and `worker` services join in Phase 0
# PR 4 (when their Dockerfile exists) and `web` in Phase 4.
#
# Every published port is bound to 127.0.0.1 rather than 0.0.0.0. The Compose
# default would expose Postgres and MinIO to every device on whatever network
# you're attached to — including hotel and cafe wifi. These are dev services
# with weak credentials; they should never be reachable off-box.

name: ai-interviewer

services:
  postgres:
    # Pinned to extension version + Postgres major + base distro, so a rebuild
    # six months from now resolves to the same image.
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -U/-d matter: bare `pg_isready` checks the server is listening, not that
      # this database accepts connections for this role.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    # S3-compatible object storage for local development only; deployment uses
    # Tigris or R2. Note this image is intentionally a year old: MinIO moved its
    # effort to a commercial product and community releases stalled. We depend
    # on the S3 API surface, which is stable, not on the console UI that recent
    # community builds dropped. Inspect buckets with `mc` or the AWS CLI.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-shot: creates the bucket, then exits. Idempotent, so `compose up`
  # repeatedly is safe.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-ai-interviewer-documents}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET\" &&
      mc anonymous set none local/\"$$S3_BUCKET\" &&
      echo 'bucket ready:' \"$$S3_BUCKET\"
      "
    restart: "no"

  api:
    build:
      context: ./apps/api
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides the host-facing values in .env: inside the Compose network
      # the services are reachable by service name, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      # Source is mounted read-only for hot reload. The virtualenv stays baked
      # into the image, so the container never depends on a host-built venv.
      - ./apps/api/src:/app/src:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
