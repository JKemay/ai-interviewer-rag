name: CI

on:
  pull_request:
  push:
    branches: [main]

# Actions are pinned to commit SHAs rather than tags. A tag is mutable: whoever
# controls the action's repository can repoint `v7` at new code, which executes
# inside our runner with our token. The trailing comment records the human
# version so Dependabot can bump both together.
#
# The default GITHUB_TOKEN is read-only here; no job in this workflow writes to
# the repository.
permissions:
  contents: read

# A new push to the same branch supersedes the previous run. Without this, a
# branch pushed three times in a minute runs CI three times concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.26"

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # The same image the Compose stack runs. RLS, pgvector and tsvector do not
    # exist in SQLite, so a substitute database would verify a system we never
    # ship.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_USER: ai_interviewer
          POSTGRES_PASSWORD: ci-throwaway-postgres
          POSTGRES_DB: ai_interviewer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_interviewer -d ai_interviewer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Throwaway credentials for a container that lives for one job on an
    # ephemeral runner with no inbound network. Deliberately literal rather than
    # repository secrets: nothing here grants access to anything, and putting
    # them in `secrets` would imply otherwise.
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://ai_interviewer:ci-throwaway-postgres@localhost:5432/ai_interviewer
      DATABASE_URL: postgresql+psycopg://ai_app:ci-throwaway-app@localhost:5432/ai_interviewer
      WORKER_DATABASE_URL: postgresql+psycopg://ai_worker:ci-throwaway-worker@localhost:5432/ai_interviewer
      DB_APP_PASSWORD: ci-throwaway-app
      DB_WORKER_PASSWORD: ci-throwaway-worker

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      # --frozen fails if uv.lock is out of date with pyproject.toml, rather
      # than silently resolving something different from what was reviewed.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      # Migrations run as the table-owning role, exactly as they will against
      # Neon. The two runtime roles are created NOLOGIN by the migration and
      # given credentials here, mirroring the local bootstrap step.
      - name: Migrate
        run: uv run alembic upgrade head

      - name: Grant login to runtime roles
        run: uv run bootstrap-db-roles

      - name: Tests
        run: uv run pytest --cov=app --cov-fail-under=80

  openapi:
    name: OpenAPI schema is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Regenerate schema
        working-directory: apps/api
        run: uv run export-openapi

      # The committed schema is the contract the frontend's TypeScript client is
      # generated from. If a response model changes and this file is not
      # regenerated, the frontend types silently describe an API that no longer
      # exists. Failing here forces the two to move together.
      - name: Fail if the committed schema has drifted
        run: |
          if ! git diff --exit-code --stat apps/api/openapi.json; then
            echo "::error::openapi.json is stale. Run 'uv run export-openapi' in apps/api and commit the result."
            git diff apps/api/openapi.json
            exit 1
          fi

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built but never pushed. This catches a broken Dockerfile in review
      # rather than at deploy time; publishing is Phase 9's job.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
